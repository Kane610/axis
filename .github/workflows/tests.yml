name: Run Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: ruff check . --output-format=github
          - name: Formatting
            command: ruff format --check .
          - name: Typing
            command: mypy axis

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check dependency lockfile
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --locked --extra requirements --extra requirements-test
      - name: Run ${{ matrix.name }}
        run: uv run --locked ${{ matrix.command }}

  tests:
    name: Tests (Python 3.14)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check dependency lockfile
        run: uv lock --check
      - name: Install dependencies
        run: |
          uv sync --locked --extra requirements --extra requirements-test
      - name: Test with pytest
        run: |
          uv run --locked pytest tests --doctest-modules --junitxml=junit/test-results.xml --cov=axis --cov-report=xml --cov-report=html
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-python-3.14
          path: |
            junit/test-results.xml
            coverage.xml
            htmlcov/
          if-no-files-found: warn
